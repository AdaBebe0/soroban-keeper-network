name: PR Hygiene

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Release notes are built from CHANGELOG.md, so user-facing contract changes
  # must come with a CHANGELOG entry. Add the `no-changelog` label to opt out.
  changelog:
    name: CHANGELOG entry for contract changes
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require CHANGELOG.md when contract source changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          # Contract source under contracts/*/src, excluding unit-test code
          # (src/test/ and src/test.rs), which is not user-facing.
          contract_src="$(grep -E '^contracts/[^/]+/src/' <<< "$changed" \
            | grep -v -E '^contracts/[^/]+/src/test(/|\.rs$)' || true)"

          if [ -z "$contract_src" ]; then
            echo "No contract source changes; CHANGELOG entry not required."
            exit 0
          fi

          echo "Contract source changes:"
          echo "$contract_src"

          if grep -qx 'CHANGELOG.md' <<< "$changed"; then
            echo "CHANGELOG.md is updated."
          else
            echo "::error::Contract source changed without a CHANGELOG.md update. Add an entry, or apply the 'no-changelog' label if the change is not user-facing."
            exit 1
          fi
